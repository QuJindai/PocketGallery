name: PocketGallery OKF Mobile Lab Canonical Sign Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phone-pilot-r3-final-apk
    paths:
      - .github/workflows/pocketgallery-okf-mobile-lab-sign-bridge.yml

permissions:
  contents: write

concurrency:
  group: pocketgallery-okf-mobile-lab-canonical-sign
  cancel-in-progress: false

jobs:
  signed-okf-mobile-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: codex/okf-mobile-lab
      TARGET_SHA: cd0c9d85be0447032372ffa8657bb6e31575f21a
      CANONICAL_SIGNER_SHA256: 81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541

    steps:
      - name: Checkout trusted signing carrier
        uses: actions/checkout@v4

      - name: Validate exact OKF target head
        id: target
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          echo "requested=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$TARGET_SHA" = "$REMOTE_SHA" ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
          echo "SIGNING_CARRIER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VALIDATED_TARGET_SHA=$REMOTE_SHA" >> "$GITHUB_ENV"

      - name: Restore canonical R3 signing identity
        id: signer-cache
        uses: actions/cache@v5
        with:
          path: ~/.android/pocketgallery-r3-signing
          key: pocketgallery-r3-signing-v1

      - name: Persist bridge probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROBE=/tmp/okf-sign-bridge-probe.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "carrier_sha=$(git rev-parse HEAD)"
            echo "target_requested=${{ steps.target.outputs.requested }}"
            echo "target_remote=${{ steps.target.outputs.remote }}"
            echo "target_match=${{ steps.target.outputs.match }}"
            echo "cache_hit=${{ steps.signer-cache.outputs.cache-hit }}"
          } | tee "$PROBE"
          ENCODED="$(base64 -w0 "$PROBE")"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/docs/ci-diagnostics/okf-sign-bridge-${GITHUB_RUN_ID}.txt" \
            -f message="ci: persist OKF signer bridge probe ${GITHUB_RUN_ID}" \
            -f content="$ENCODED" \
            -f branch="$GITHUB_REF_NAME" >/dev/null

      - name: Enforce target and signer cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.target.outputs.match }}" = "true"
          test "${{ steps.signer-cache.outputs.cache-hit }}" = "true"

      - name: Verify canonical identity without mutation
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/pocketgallery-r3-signing"
          bash pilot/flutter_phone_loop/scripts/verify_canonical_signer.sh \
            "$SIGN_DIR" \
            pocketgallery-r3 \
            "$CANONICAL_SIGNER_SHA256"
          PASSWORD="$(<"$SIGN_DIR/password")"
          echo "::add-mask::$PASSWORD"
          {
            echo "POCKETGALLERY_SIGNING_KEYSTORE=$SIGN_DIR/r3.keystore"
            echo "POCKETGALLERY_SIGNING_STORE_PASSWORD=$PASSWORD"
            echo "POCKETGALLERY_SIGNING_KEY_PASSWORD=$PASSWORD"
            echo "POCKETGALLERY_SIGNING_KEY_ALIAS=pocketgallery-r3"
          } >> "$GITHUB_ENV"

      - name: Checkout validated OKF source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "SOURCE_TREE=$SOURCE_TREE"
          test "$SOURCE_SHA" = "$VALIDATED_TARGET_SHA"
          git diff --exit-code

      - name: Record source integrity snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd pilot/flutter_phone_loop
          bash scripts/generate_manifests.sh inner | tee /tmp/pg-inner.sha256
          bash scripts/generate_manifests.sh outer | tee /tmp/pg-outer.sha256
          test -s /tmp/pg-inner.sha256
          test -s /tmp/pg-outer.sha256

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh

      - name: Analyze
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze

      - name: Full Flutter regression suite
        working-directory: pilot/flutter_phone_loop
        run: flutter test

      - name: Build canonical arm64 signed APK
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk

      - name: Verify package version ABI and canonical signer
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk
          ABIS="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          test "$ABIS" = "arm64-v8a"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)"
          VERSION_CODE="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)"
          VERSION_NAME="$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)"
          EXPECTED_VERSION_CODE="$(bash scripts/android_version_code.sh)"
          test "$PACKAGE" = "com.qujindai.pocketgallery_phone_pilot.r3"
          test "$VERSION_CODE" = "2022"
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apksigner.txt
          APK_CERT="$(grep -i 'certificate.*sha-256.*digest' /tmp/apksigner.txt | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT" = "$CANONICAL_SIGNER_SHA256"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          OUTPUT_DIR=build/app/outputs/flutter-apk
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$APK")" > "$APK.sha256"
          cp /tmp/pg-inner.sha256 "$OUTPUT_DIR/source-inner.sha256"
          cp /tmp/pg-outer.sha256 "$OUTPUT_DIR/source-outer.sha256"
          {
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "SIGNING_CARRIER_SHA=$SIGNING_CARRIER_SHA"
            echo "APK_PACKAGE=$PACKAGE"
            echo "APK_VERSION_CODE=$VERSION_CODE"
            echo "APK_VERSION_NAME=$VERSION_NAME"
            echo "APK_ABIS=$ABIS"
            echo "APK_SIGNER_SHA256=$APK_CERT"
            echo "APK_SHA256=$APK_SHA256"
          } | tee "$OUTPUT_DIR/SIGNED_BUILD_PROOF.txt"

      - name: Upload signed APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-OKF-Mobile-Lab-Signed-arm64
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk.sha256
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/SIGNED_BUILD_PROOF.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed prerelease asset
        working-directory: pilot/flutter_phone_loop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="okf-mobile-lab-signed-${GITHUB_RUN_ID}"
          OUT=build/app/outputs/flutter-apk
          gh release create "$TAG" \
            "$OUT/PocketGallery-OKF-Mobile-Lab-arm64.apk#PocketGallery-OKF-Mobile-Lab-arm64.apk" \
            "$OUT/PocketGallery-OKF-Mobile-Lab-arm64.apk.sha256#PocketGallery-OKF-Mobile-Lab-arm64.apk.sha256" \
            "$OUT/SIGNED_BUILD_PROOF.txt#SIGNED_BUILD_PROOF.txt" \
            --target "$TARGET_SHA" \
            --title "PocketGallery OKF Mobile Lab signed ${GITHUB_RUN_ID}" \
            --notes "Canonical R3-signed arm64 OKF Mobile Lab. Source ${TARGET_SHA}." \
            --prerelease
