name: R4.7 OKF A-F Static Fix

on:
  push:
    branches:
      - codex/r47-okf-af-benchmark
    paths:
      - '.github/workflows/r47-okf-af-static-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r47-okf-af-benchmark
          fetch-depth: 0

      - name: Apply static-only edits
        id: patch
        shell: bash
        run: |
          set +e
          python3 - <<'PY' 2>&1 | tee /tmp/af-patch.log
          from pathlib import Path

          runner = Path('pilot/flutter_phone_loop/lib/okf/okf_af_runner.dart')
          text = runner.read_text()
          needle = "import '../core/models.dart';\n"
          replacement = "import '../core/evidence.dart';\nimport '../core/models.dart';\n"
          if "../core/evidence.dart" not in text:
              if text.count(needle) != 1:
                  raise SystemExit('runner import contract mismatch')
              text = text.replace(needle, replacement)
          runner.write_text(text)

          core = Path('pilot/flutter_phone_loop/lib/okf/okf_af_benchmark.dart')
          text = core.read_text()
          old_ctor = """  OkfAfCorpus._({
    required this.concepts,
    required this.ordinaryChunks,
  });

  final Map<String, _AfConcept> concepts;
  final List<_AfOrdinaryChunk> ordinaryChunks;
"""
          new_ctor = """  OkfAfCorpus._({
    required Map<String, _AfConcept> concepts,
    required List<_AfOrdinaryChunk> ordinaryChunks,
  }) : _concepts = concepts,
       _ordinaryChunks = ordinaryChunks;

  final Map<String, _AfConcept> _concepts;
  final List<_AfOrdinaryChunk> _ordinaryChunks;
"""
          if old_ctor in text:
              text = text.replace(old_ctor, new_ctor, 1)
          elif '_concepts = concepts' not in text:
              raise SystemExit('corpus constructor contract mismatch')

          text = text.replace('corpus.ordinaryChunks', 'corpus._ordinaryChunks')
          text = text.replace('corpus.concepts', 'corpus._concepts')
          text = text.replace('        markdown: entry.value,\n', '')
          text = text.replace('    required this.markdown,\n', '')
          text = text.replace('  final String markdown;\n', '')
          core.write_text(text)
          PY
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          git diff --check 2>&1 | tee -a /tmp/af-patch.log
          DIFF_CODE=${PIPESTATUS[0]}
          if [[ "$CODE" = "0" && "$DIFF_CODE" != "0" ]]; then CODE="$DIFF_CODE"; fi
          echo "final_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get

      - name: Format touched files
        if: steps.patch.outputs.final_code == '0'
        working-directory: pilot/flutter_phone_loop
        run: dart format lib/okf/okf_af_benchmark.dart lib/okf/okf_af_runner.dart

      - name: Analyze after patch
        id: analyze
        if: steps.patch.outputs.final_code == '0'
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/af-static-analyze.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Focused tests after patch
        id: tests
        if: steps.patch.outputs.final_code == '0'
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set +e
          flutter test test/r47_okf_af_benchmark_test.dart test/r47_okf_af_ui_test.dart 2>&1 | tee /tmp/af-static-tests.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist static-fix diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/af-static-fix.txt
          {
            echo "source_sha=$GITHUB_SHA"
            echo "patch_exit=${{ steps.patch.outputs.final_code }}"
            echo "analyze_exit=${{ steps.analyze.outputs.code }}"
            echo "tests_exit=${{ steps.tests.outputs.code }}"
            echo
            echo "===== PATCH ====="
            tail -n 100 /tmp/af-patch.log 2>/dev/null || true
            echo
            echo "===== ANALYZE ====="
            tail -n 160 /tmp/af-static-analyze.log 2>/dev/null || true
            echo
            echo "===== TESTS ====="
            tail -n 220 /tmp/af-static-tests.log 2>/dev/null || true
          } > "$OUT"
          PATH_URL="repos/${GITHUB_REPOSITORY}/contents/docs/superpowers/diagnostics/R47_OKF_AF_STATIC_FIX.txt"
          EXISTING="$(gh api "$PATH_URL?ref=r47-signing-diagnostic-readback" --jq .sha 2>/dev/null || true)"
          CONTENT="$(base64 -w0 "$OUT")"
          ARGS=(--method PUT "$PATH_URL" -f message="ci: update R4.7 A-F static-fix diagnostic" -f content="$CONTENT" -f branch="r47-signing-diagnostic-readback")
          if [[ -n "$EXISTING" ]]; then ARGS+=(-f sha="$EXISTING"); fi
          gh api "${ARGS[@]}" >/dev/null

      - name: Enforce green gate
        shell: bash
        run: |
          test "${{ steps.patch.outputs.final_code }}" = "0"
          test "${{ steps.analyze.outputs.code }}" = "0"
          test "${{ steps.tests.outputs.code }}" = "0"

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot/flutter_phone_loop/lib/okf/okf_af_benchmark.dart pilot/flutter_phone_loop/lib/okf/okf_af_runner.dart
          git diff --cached --check
          git commit -m "fix(r47): make A-F benchmark analyzer clean"
          git push origin HEAD:codex/r47-okf-af-benchmark
