name: Local Video RIFE APK

on:
  push:
    branches:
      - ci/local-video-rife-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  red-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Run RED unit tests
        working-directory: local-video
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log
          code=${PIPESTATUS[0]}
          echo "gradle_exit_code=$code"
          exit "$code"

      - name: Upload RED log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-video-red-log
          path: local-video/unit-test.log
          if-no-files-found: ignore
