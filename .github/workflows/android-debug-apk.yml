name: Android Debug APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PocketGallery
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"

      - name: Verify downstream scripts
        run: |
          bash scripts/verify/test_materialize_upstream.sh
          bash scripts/verify/test_apply_overlay.sh
          bash scripts/verify/test_build_android_debug.sh

      - name: Build debug APK
        run: bash scripts/build/build_android_debug.sh

      - name: Verify APK exists
        run: test -f .work/gallery/Android/src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-debug-apk
          path: .work/gallery/Android/src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
