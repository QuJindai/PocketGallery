plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qujindai.localvideo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.qujindai.localvideo'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
