name: PocketGallery Phone Pilot APK

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/phone-pilot-r3-final-apk", "feature/phone-pilot-r41-rag-microscope", "feature/phone-pilot-r46-runtime-lineage"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"
  pull_request:
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"

permissions:
  contents: read

jobs:
  pilot-apk:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/phone-pilot-r3-final-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent R3 signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/pocketgallery-r3-signing
          key: pocketgallery-r3-signing-v1
          save-always: true

      - name: Prepare persistent R3 signing identity
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/pocketgallery-r3-signing"
          KEYSTORE="$SIGN_DIR/r3.keystore"
          PASSFILE="$SIGN_DIR/password"
          ALIAS="pocketgallery-r3"
          CANONICAL_SIGNER_SHA256=81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541
          echo "CANONICAL_SIGNER_SHA256=$CANONICAL_SIGNER_SHA256" >> "$GITHUB_ENV"

          # A missing signing cache is a release blocker. Never manufacture a
          # new key in CI: that would make Android reject in-place upgrades and
          # force users to uninstall, which also destroys OAuth/model state.
          if [[ ! -s "$KEYSTORE" || ! -s "$PASSFILE" ]]; then
            echo "::error::SIGNING_IDENTITY_MISSING: canonical PocketGallery pilot key is unavailable; refusing to rotate signing identity"
            exit 74
          fi

          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -alias "$ALIAS" \
            -file /tmp/pocketgallery-r3-cert.der >/dev/null
          KEY_CERT="$(sha256sum /tmp/pocketgallery-r3-cert.der | awk '{print $1}')"
          echo "CANONICAL_SIGNER_EXPECTED=$CANONICAL_SIGNER_SHA256"
          echo "RESTORED_SIGNER_SHA256=$KEY_CERT"
          if [[ "$KEY_CERT" != "$CANONICAL_SIGNER_SHA256" ]]; then
            echo "::error::SIGNING_IDENTITY_MISMATCH: refusing to publish an APK that cannot update the installed R4.1 pilot"
            exit 75
          fi

          {
            echo "POCKETGALLERY_SIGNING_KEYSTORE=$KEYSTORE"
            echo "POCKETGALLERY_SIGNING_STORE_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Record source integrity snapshot
        run: |
          git diff --exit-code
          cd pilot/flutter_phone_loop
          bash scripts/generate_manifests.sh inner | tee /tmp/pg-inner.sha256
          bash scripts/generate_manifests.sh outer | tee /tmp/pg-outer.sha256
          test -s /tmp/pg-inner.sha256
          test -s /tmp/pg-outer.sha256

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh

      - name: Environment
        working-directory: pilot/flutter_phone_loop
        run: flutter --version

      - name: Analyze
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze

      - name: Unit tests
        working-directory: pilot/flutter_phone_loop
        run: flutter test

      - name: Build arm64 debug APK
        working-directory: pilot/flutter_phone_loop
        run: |
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify package, version, ABI and canonical signing certificate
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ABIS="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          echo "APK_ABIS=$ABIS"
          test "$ABIS" = "arm64-v8a"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "APK_PACKAGE=$PKG"
          echo "APK_VERSION_CODE=$VERSION_CODE"
          test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -ge 2018

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apksigner.txt
          APK_CERT="$(grep -i 'certificate.*sha-256.*digest' /tmp/apksigner.txt | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          echo "APK_SIGNER_SHA256=$APK_CERT"
          echo "CANONICAL_SIGNER_SHA256=$CANONICAL_SIGNER_SHA256"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$CANONICAL_SIGNER_SHA256"

      - name: Hash APK
        working-directory: pilot/flutter_phone_loop
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-Phone-Pilot-R3-debug-apk
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/app-debug.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

# R3_FINAL_GREEN_GATE
