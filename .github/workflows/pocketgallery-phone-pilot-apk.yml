name: PocketGallery Phone Pilot APK

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/phone-pilot-r3-final-apk"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"
  pull_request:
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"

permissions:
  contents: read

jobs:
  pilot-apk:
    # The final R3 branch is verified by its push run so the first signing-key
    # cache is created exactly once instead of racing a simultaneous PR run.
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/phone-pilot-r3-final-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent R3 signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/pocketgallery-r3-signing
          key: pocketgallery-r3-signing-v1

      - name: Prepare persistent R3 signing identity
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/pocketgallery-r3-signing"
          KEYSTORE="$SIGN_DIR/r3.keystore"
          PASSFILE="$SIGN_DIR/password"
          ALIAS="pocketgallery-r3"
          mkdir -p "$SIGN_DIR"

          if [[ ! -s "$KEYSTORE" || ! -s "$PASSFILE" ]]; then
            rm -f "$KEYSTORE" "$PASSFILE"
            PASS="$(openssl rand -hex 32)"
            printf '%s' "$PASS" > "$PASSFILE"
            chmod 600 "$PASSFILE"
            keytool -genkeypair -noprompt \
              -storetype JKS \
              -keystore "$KEYSTORE" \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 36500 \
              -dname "CN=PocketGallery R3 Pilot, OU=Phone Pilot, O=QuJindai, L=Local, ST=Local, C=CN"
          fi

          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"
          {
            echo "POCKETGALLERY_SIGNING_KEYSTORE=$KEYSTORE"
            echo "POCKETGALLERY_SIGNING_STORE_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -alias "$ALIAS" \
            -file /tmp/pocketgallery-r3-cert.der >/dev/null
          sha256sum /tmp/pocketgallery-r3-cert.der | tee /tmp/pocketgallery-r3-cert.sha256

      - name: Record source integrity snapshot
        run: |
          git diff --exit-code
          cd pilot/flutter_phone_loop
          bash scripts/generate_manifests.sh inner | tee /tmp/pg-inner.sha256
          bash scripts/generate_manifests.sh outer | tee /tmp/pg-outer.sha256
          test -s /tmp/pg-inner.sha256
          test -s /tmp/pg-outer.sha256

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh

      - name: Environment
        working-directory: pilot/flutter_phone_loop
        run: flutter --version

      - name: Analyze
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze

      - name: Unit tests
        working-directory: pilot/flutter_phone_loop
        run: flutter test

      - name: Build arm64 debug APK
        working-directory: pilot/flutter_phone_loop
        run: |
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify R3 package, ABI and signing certificate
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ABIS="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          echo "APK_ABIS=$ABIS"
          test "$ABIS" = "arm64-v8a"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          PKG="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          echo "APK_PACKAGE=$PKG"
          test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          APK_CERT="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          PASS="$(cat "$HOME/.android/pocketgallery-r3-signing/password")"
          keytool -exportcert \
            -keystore "$HOME/.android/pocketgallery-r3-signing/r3.keystore" \
            -storepass "$PASS" \
            -alias pocketgallery-r3 \
            -file /tmp/pocketgallery-r3-cert-verify.der >/dev/null
          KEY_CERT="$(sha256sum /tmp/pocketgallery-r3-cert-verify.der | awk '{print $1}')"
          echo "APK_SIGNER_SHA256=$APK_CERT"
          echo "R3_KEY_SHA256=$KEY_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"

      - name: Hash APK
        working-directory: pilot/flutter_phone_loop
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-Phone-Pilot-R3-debug-apk
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/app-debug.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

# R3_FINAL_GREEN_GATE
