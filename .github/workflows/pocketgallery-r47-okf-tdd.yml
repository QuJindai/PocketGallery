name: PocketGallery R4.7 OKF TDD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  okf-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get
      - name: R4.7 RED-GREEN contracts
        working-directory: pilot/flutter_phone_loop
        run: flutter test test/r47_okf_parser_test.dart test/r47_okf_integration_contract_test.dart
