name: R4.7 OKF Lint Fix

on:
  push:
    branches:
      - codex/r47-okf-gallery
    paths:
      - '.github/workflows/r47-okf-lint-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r47-okf-lint-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    env:
      READBACK_BRANCH: r47-signing-diagnostic-readback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r47-okf-gallery
          fetch-depth: 0

      - name: Apply exactly two lint-only edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine = Path('pilot/flutter_phone_loop/lib/okf/okf_experiment_engine.dart')
          text = engine.read_text()
          replacements = {
              'required LineageStore store,': 'required super.store,',
              'required LexicalFtsStore lexicalStore,': 'required super.lexicalStore,',
              'required RepresentationBuilder representationBuilder,': 'required super.representationBuilder,',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{old!r} count={count}; expected 1')
              text = text.replace(old, new)
          pattern = re.compile(
              r"\}\) : super\(\s*"
              r"store: store,\s*"
              r"lexicalStore: lexicalStore,\s*"
              r"representationBuilder: representationBuilder,\s*"
              r"clock: now,\s*"
              r"\);"
          )
          text, count = pattern.subn('}) : super(clock: now);', text)
          if count != 1:
              raise SystemExit(f'super initializer replacement count={count}; expected 1')
          engine.write_text(text)

          test_file = Path('pilot/flutter_phone_loop/test/r47_okf_shadow_lab_test.dart')
          test_text = test_file.read_text()
          unused = "import 'package:pocketgallery_phone_pilot/okf/okf_models.dart';\n"
          count = test_text.count(unused)
          if count != 1:
              raise SystemExit(f'unused import replacement count={count}; expected 1')
          test_file.write_text(test_text.replace(unused, ''))
          PY
          git diff --check

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get

      - name: Format only touched R4.7 files
        working-directory: pilot/flutter_phone_loop
        run: |
          dart format lib/okf/okf_experiment_engine.dart test/r47_okf_shadow_lab_test.dart
          git diff --check

      - name: Analyze full Flutter package and capture result
        id: analyze
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/r47-post-edit-analyze.log 2>&1
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          cat /tmp/r47-post-edit-analyze.log
          exit 0

      - name: Persist post-edit analyzer diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/r47-post-edit-analyze-diagnostic.txt
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "analyze_exit=${{ steps.analyze.outputs.exit_code }}"
            echo
            echo "===== FLUTTER ANALYZE AFTER EDITS ====="
            cat /tmp/r47-post-edit-analyze.log 2>/dev/null || true
          } > "$REPORT"
          FILE="docs/superpowers/diagnostics/r47-post-edit-analyze-${GITHUB_RUN_ID}.txt"
          CONTENT="$(base64 -w0 "$REPORT")"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
            -f message="docs: persist R4.7 post-edit analyzer diagnostic ${GITHUB_RUN_ID}" \
            -f content="$CONTENT" \
            -f branch="$READBACK_BRANCH" >/dev/null

      - name: Enforce analyzer gate
        run: test "${{ steps.analyze.outputs.exit_code }}" = "0"

      - name: Run all R4.7 tests
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find test -maxdepth 1 -type f -name 'r47*.dart' -print | sort)
          test "${#TESTS[@]}" -gt 0
          flutter test "${TESTS[@]}"

      - name: Commit verified lint-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilot/flutter_phone_loop/lib/okf/okf_experiment_engine.dart \
            pilot/flutter_phone_loop/test/r47_okf_shadow_lab_test.dart
          git diff --cached --check
          git commit -m "fix(r47): satisfy OKF analyzer gate"
          git push origin HEAD:codex/r47-okf-gallery
