name: PocketGallery R4.6 TDD

on:
  workflow_dispatch:
  push:
    branches: ["feature/phone-pilot-r46-runtime-lineage"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-r46-tdd.yml"
  pull_request:
    branches: ["feature/phone-pilot-r46-runtime-lineage"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-r46-tdd.yml"

permissions:
  contents: read

jobs:
  r46-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter environment
        working-directory: pilot/flutter_phone_loop
        run: flutter --version
      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get
      - name: Analyze R4.6 batch 1
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze
      - name: Full Flutter regression suite
        working-directory: pilot/flutter_phone_loop
        run: flutter test
      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh
      - name: Build R4.9 arm64 debug APK
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE="$(bash scripts/android_version_code.sh)"
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          ABIS="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          echo "APK_ABIS=$ABIS"
          test "$ABIS" = "arm64-v8a"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "APK_PACKAGE=$PKG"
          echo "APK_VERSION_CODE=$VERSION_CODE"
          echo "EXPECTED_VERSION_CODE=$ANDROID_VERSION_CODE"
          test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"
          test "$VERSION_CODE" = "$ANDROID_VERSION_CODE"
          cp "$APK" build/app/outputs/flutter-apk/PocketGallery-R49-rotatable-3d-debug.apk
          sha256sum build/app/outputs/flutter-apk/PocketGallery-R49-rotatable-3d-debug.apk > build/app/outputs/flutter-apk/PocketGallery-R49-rotatable-3d-debug.apk.sha256
      - name: Upload R4.9 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-R49-rotatable-3d-debug-apk
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R49-rotatable-3d-debug.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R49-rotatable-3d-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
