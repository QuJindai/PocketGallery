name: PocketGallery R5.0 TDD

on:
  workflow_dispatch:
  push:
    branches: ["feature/phone-pilot-r46-runtime-lineage"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-r46-tdd.yml"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"
      - "DROPIN_MANIFEST.sha256"
      - "PILOT_DROPIN_README.md"
  pull_request:
    branches: ["feature/phone-pilot-r46-runtime-lineage"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-r46-tdd.yml"
      - ".github/workflows/pocketgallery-phone-pilot-apk.yml"
      - "DROPIN_MANIFEST.sha256"
      - "PILOT_DROPIN_README.md"

permissions:
  contents: read

jobs:
  r46-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed source manifests
        working-directory: pilot/flutter_phone_loop
        run: |
          set -euo pipefail
          INNER_MANIFEST="$RUNNER_TEMP/pg-inner.sha256"
          OUTER_MANIFEST="$RUNNER_TEMP/pg-outer.sha256"
          bash scripts/generate_manifests.sh inner > "$INNER_MANIFEST"
          bash scripts/generate_manifests.sh outer > "$OUTER_MANIFEST"
          test -s "$INNER_MANIFEST"
          test -s "$OUTER_MANIFEST"
          diff -u MANIFEST.sha256 "$INNER_MANIFEST"
          diff -u ../../DROPIN_MANIFEST.sha256 "$OUTER_MANIFEST"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter environment
        working-directory: pilot/flutter_phone_loop
        run: flutter --version
      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get
      - name: Verify Dart formatting
        working-directory: pilot/flutter_phone_loop
        run: |
          set -euo pipefail
          if ! dart format --output=none --set-exit-if-changed lib test tool; then
            dart format lib test tool
            git diff -- lib/acceptance/golden_reason_code_contract.dart lib/acceptance/handset_report_exporter.dart lib/acceptance/release_readiness_adjudicator.dart lib/services/golden_gate_executor.dart lib/services/golden_test_runner.dart test/r50_handset_report_redaction_test.dart
            exit 1
          fi
      - name: Analyze R5.0
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze
      - name: Full Flutter regression suite
        working-directory: pilot/flutter_phone_loop
        run: flutter test
      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh
      - name: Build R5.0 non-canonical arm64 debug APK
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ANDROID_VERSION_CODE="$(bash scripts/android_version_code.sh)"
          test "$ANDROID_VERSION_CODE" = "2023"
          flutter build apk --debug --target-platform android-arm64 --split-per-abi \
            --dart-define=POCKETGALLERY_SOURCE_COMMIT="$SOURCE_COMMIT"
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          ABIS="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          echo "APK_ABIS=$ABIS"
          test "$ABIS" = "arm64-v8a"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          echo "APK_PACKAGE=$PKG"
          echo "APK_VERSION_CODE=$VERSION_CODE"
          echo "EXPECTED_VERSION_CODE=2023"
          test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"
          test "$VERSION_CODE" = "2023"
          cp "$APK" build/app/outputs/flutter-apk/PocketGallery-R50-handset-acceptance-debug.apk
          sha256sum build/app/outputs/flutter-apk/PocketGallery-R50-handset-acceptance-debug.apk > build/app/outputs/flutter-apk/PocketGallery-R50-handset-acceptance-debug.apk.sha256
      - name: Upload R5.0 non-canonical debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-R50-handset-acceptance-debug-apk
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-handset-acceptance-debug.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-handset-acceptance-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
