name: PocketGallery Phone Pilot APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: pocketgallery-canonical-signing

    steps:
      - uses: actions/checkout@v4

      - name: Record source integrity snapshot
        run: |
          git diff --exit-code
          cd pilot/flutter_phone_loop
          bash scripts/generate_manifests.sh inner | tee "$RUNNER_TEMP/pg-inner.sha256"
          bash scripts/generate_manifests.sh outer | tee "$RUNNER_TEMP/pg-outer.sha256"
          test -s "$RUNNER_TEMP/pg-inner.sha256"
          test -s "$RUNNER_TEMP/pg-outer.sha256"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh

      - name: Environment
        working-directory: pilot/flutter_phone_loop
        run: flutter --version

      - name: Analyze
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze

      - name: Unit tests
        working-directory: pilot/flutter_phone_loop
        run: flutter test

      - name: Build same-source R5.0 canonical upgrade pair
        working-directory: pilot/flutter_phone_loop
        shell: bash
        env:
          POCKETGALLERY_SIGNING_KEYSTORE_B64: ${{ secrets.POCKETGALLERY_SIGNING_KEYSTORE_B64 }}
          POCKETGALLERY_SIGNING_STORE_PASSWORD: ${{ secrets.POCKETGALLERY_SIGNING_STORE_PASSWORD }}
          POCKETGALLERY_SIGNING_KEY_PASSWORD: ${{ secrets.POCKETGALLERY_SIGNING_KEY_PASSWORD }}
          POCKETGALLERY_SIGNING_KEY_ALIAS: ${{ secrets.POCKETGALLERY_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SECRET_KEYSTORE="$RUNNER_TEMP/pocketgallery-r3-signing/r3.keystore"
          CERT_FILE="$RUNNER_TEMP/pocketgallery-r3-cert.der"
          CANONICAL_SIGNER_SHA256=81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541
          cleanup_signing() {
            unset POCKETGALLERY_SIGNING_KEYSTORE_B64
            unset POCKETGALLERY_SIGNING_KEYSTORE
            unset POCKETGALLERY_SIGNING_STORE_PASSWORD
            unset POCKETGALLERY_SIGNING_KEY_PASSWORD
            unset POCKETGALLERY_SIGNING_KEY_ALIAS
            rm -f "$SECRET_KEYSTORE" "$CERT_FILE"
            rm -f android/app/pocketgallery-pilot.keystore
            rm -f android/app/build.gradle android/app/build.gradle.kts
          }
          trap cleanup_signing EXIT

          if [[ -z "$POCKETGALLERY_SIGNING_KEYSTORE_B64" || \
                -z "$POCKETGALLERY_SIGNING_STORE_PASSWORD" || \
                -z "$POCKETGALLERY_SIGNING_KEY_PASSWORD" || \
                -z "$POCKETGALLERY_SIGNING_KEY_ALIAS" ]]; then
            echo "::error::SIGNING_IDENTITY_MISSING: all four canonical signing secrets are required"
            exit 74
          fi
          mkdir -p "$(dirname "$SECRET_KEYSTORE")"
          if ! printf '%s' "$POCKETGALLERY_SIGNING_KEYSTORE_B64" | base64 --decode > "$SECRET_KEYSTORE"; then
            echo "::error::SIGNING_IDENTITY_MISSING: provisioned canonical keystore is not valid base64"
            exit 74
          fi
          chmod 600 "$SECRET_KEYSTORE"
          echo "::add-mask::$POCKETGALLERY_SIGNING_STORE_PASSWORD"
          echo "::add-mask::$POCKETGALLERY_SIGNING_KEY_PASSWORD"
          echo "::add-mask::$POCKETGALLERY_SIGNING_KEY_ALIAS"
          keytool -exportcert \
            -keystore "$SECRET_KEYSTORE" \
            -storepass "$POCKETGALLERY_SIGNING_STORE_PASSWORD" \
            -alias "$POCKETGALLERY_SIGNING_KEY_ALIAS" \
            -file "$CERT_FILE" >/dev/null
          KEY_CERT="$(sha256sum "$CERT_FILE" | awk '{print $1}')"
          echo "CANONICAL_SIGNER_EXPECTED=$CANONICAL_SIGNER_SHA256"
          echo "RESTORED_SIGNER_SHA256=$KEY_CERT"
          if [[ "$KEY_CERT" != "$CANONICAL_SIGNER_SHA256" ]]; then
            echo "::error::SIGNING_IDENTITY_MISMATCH: refusing to publish an APK that cannot update the installed pilot"
            exit 75
          fi

          export POCKETGALLERY_SIGNING_KEYSTORE="$SECRET_KEYSTORE"
          bash scripts/bootstrap_android.sh
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          ARTIFACT_DIR="build/app/outputs/flutter-apk"
          BASELINE_APK="$ARTIFACT_DIR/PocketGallery-R50-baseline-v2022.apk"
          CANDIDATE_APK="$ARTIFACT_DIR/PocketGallery-R50-candidate-v2023.apk"

          flutter build apk --debug --target-platform android-arm64 --split-per-abi \
            --build-name=0.5.0 \
            --build-number=22 \
            --dart-define=POCKETGALLERY_SOURCE_COMMIT="$SOURCE_COMMIT"
          cp "$ARTIFACT_DIR/app-arm64-v8a-debug.apk" "$BASELINE_APK"

          flutter build apk --debug --target-platform android-arm64 --split-per-abi \
            --build-name=0.5.0 \
            --build-number=23 \
            --dart-define=POCKETGALLERY_SOURCE_COMMIT="$SOURCE_COMMIT"
          cp "$ARTIFACT_DIR/app-arm64-v8a-debug.apk" "$CANDIDATE_APK"

      - name: Verify canonical R5.0 upgrade pair
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SIGNER_SHA256=81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541
          ARTIFACT_DIR="build/app/outputs/flutter-apk"
          BASELINE_APK="$ARTIFACT_DIR/PocketGallery-R50-baseline-v2022.apk"
          CANDIDATE_APK="$ARTIFACT_DIR/PocketGallery-R50-candidate-v2023.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          verify_apk() {
            local apk="$1"
            local expected_version_code="$2"
            test -s "$apk"
            local abis
            abis="$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
            ABIS="$abis"
            echo "APK_ABIS=$ABIS"
            test "$ABIS" = "arm64-v8a"

            local badging pkg version_code signer_output apk_cert
            badging="$($AAPT dump badging "$apk")"
            pkg="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
            version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
            PKG="$pkg"
            VERSION_CODE="$version_code"
            echo "APK_PACKAGE=$PKG"
            echo "APK_VERSION_CODE=$VERSION_CODE"
            test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"
            test "$VERSION_CODE" -ge 2020
            test "$VERSION_CODE" = "$expected_version_code"

            signer_output="$RUNNER_TEMP/apksigner-$expected_version_code.txt"
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | tee "$signer_output"
            apk_cert="$(grep -i 'certificate.*sha-256.*digest' "$signer_output" | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            APK_CERT="$apk_cert"
            echo "APK_SIGNER_SHA256=$APK_CERT"
            test -n "$APK_CERT"
            test "$APK_CERT" = "$CANONICAL_SIGNER_SHA256"
          }

          verify_apk "$BASELINE_APK" 2022
          verify_apk "$CANDIDATE_APK" 2023

      - name: Hash canonical R5.0 upgrade pair
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="build/app/outputs/flutter-apk"
          BASELINE_APK="$ARTIFACT_DIR/PocketGallery-R50-baseline-v2022.apk"
          CANDIDATE_APK="$ARTIFACT_DIR/PocketGallery-R50-candidate-v2023.apk"
          sha256sum "$BASELINE_APK" | tee "$BASELINE_APK.sha256"
          sha256sum "$CANDIDATE_APK" | tee "$CANDIDATE_APK.sha256"

      - name: Emit automated release evidence
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          CANONICAL_SIGNER_SHA256=81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541
          ARTIFACT_DIR="build/app/outputs/flutter-apk"
          CANDIDATE_APK="$ARTIFACT_DIR/PocketGallery-R50-candidate-v2023.apk"
          CANDIDATE_SHA256="$(awk '{print $1}' "$CANDIDATE_APK.sha256")"
          AUTOMATED_EVIDENCE="$ARTIFACT_DIR/PG_AUTOMATED_EVIDENCE.json"
          cat > "$AUTOMATED_EVIDENCE" <<JSON
          {
            "schema": "pocketgallery.r50.automated-evidence.v1",
            "sourceCommit": "$SOURCE_COMMIT",
            "automatedGatesPassed": true,
            "packageName": "com.qujindai.pocketgallery_phone_pilot.r3",
            "baselineVersionCode": 2022,
            "versionCode": 2023,
            "signerSha256": "$CANONICAL_SIGNER_SHA256",
            "apkSha256": "$CANDIDATE_SHA256",
            "workflowIdentity": "$GITHUB_WORKFLOW/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          }
          JSON
          test -s "$AUTOMATED_EVIDENCE"

      - name: Upload canonical R5.0 upgrade pair and evidence
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-R50-canonical-upgrade-pair
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-baseline-v2022.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-baseline-v2022.apk.sha256
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-candidate-v2023.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-R50-candidate-v2023.apk.sha256
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PG_AUTOMATED_EVIDENCE.json
          if-no-files-found: error
          retention-days: 14

# R3_FINAL_GREEN_GATE
