name: PocketGallery OKF Mobile Lab APK

on:
  workflow_dispatch:
  push:
    branches: ["codex/okf-mobile-lab"]
    paths:
      - "pilot/flutter_phone_loop/**"
      - ".github/workflows/pocketgallery-okf-mobile-lab-apk.yml"

permissions:
  contents: write

jobs:
  okf-mobile-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: pilot/flutter_phone_loop
        run: flutter pub get

      - name: Analyze
        working-directory: pilot/flutter_phone_loop
        run: flutter analyze

      - name: OKF focused tests
        working-directory: pilot/flutter_phone_loop
        run: |
          flutter test \
            test/okf_parser_test.dart \
            test/okf_retriever_test.dart \
            test/okf_mobile_lab_page_test.dart

      - name: Full Flutter regression suite
        working-directory: pilot/flutter_phone_loop
        run: flutter test

      - name: Restore persistent R3 signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/pocketgallery-r3-signing
          key: pocketgallery-r3-signing-v1
          save-always: true

      - name: Prepare canonical signing identity
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/pocketgallery-r3-signing"
          KEYSTORE="$SIGN_DIR/r3.keystore"
          PASSFILE="$SIGN_DIR/password"
          ALIAS="pocketgallery-r3"
          CANONICAL_SIGNER_SHA256=81af4a5ef94c236774f0e193b2a4b248805b36c14cc36e2a56df8e451a712541
          echo "CANONICAL_SIGNER_SHA256=$CANONICAL_SIGNER_SHA256" >> "$GITHUB_ENV"
          if [[ ! -s "$KEYSTORE" || ! -s "$PASSFILE" ]]; then
            echo "::error::SIGNING_IDENTITY_MISSING: refusing to rotate the installed-app signer"
            exit 74
          fi
          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"
          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -alias "$ALIAS" \
            -file /tmp/pocketgallery-r3-cert.der >/dev/null
          KEY_CERT="$(sha256sum /tmp/pocketgallery-r3-cert.der | awk '{print $1}')"
          test "$KEY_CERT" = "$CANONICAL_SIGNER_SHA256"
          {
            echo "POCKETGALLERY_SIGNING_KEYSTORE=$KEYSTORE"
            echo "POCKETGALLERY_SIGNING_STORE_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_PASSWORD=$PASS"
            echo "POCKETGALLERY_SIGNING_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Bootstrap Android scaffold
        working-directory: pilot/flutter_phone_loop
        run: bash scripts/bootstrap_android.sh

      - name: Build signed arm64 APK
        working-directory: pilot/flutter_phone_loop
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          OUT=build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk
          cp "$APK" "$OUT"
          test -s "$OUT"

          ABIS="$(unzip -Z1 "$OUT" | grep -E '^lib/[^/]+/.*\.so$' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u | paste -sd, -)"
          echo "APK_ABIS=$ABIS"
          test "$ABIS" = "arm64-v8a"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$OUT")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          EXPECTED_VERSION_CODE="$(bash scripts/android_version_code.sh)"
          echo "APK_PACKAGE=$PKG"
          echo "APK_VERSION_CODE=$VERSION_CODE"
          echo "EXPECTED_VERSION_CODE=$EXPECTED_VERSION_CODE"
          test "$PKG" = "com.qujindai.pocketgallery_phone_pilot.r3"
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$VERSION_CODE" -ge 2020

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" 2>&1 | tee /tmp/apksigner.txt
          APK_CERT="$(grep -i 'certificate.*sha-256.*digest' /tmp/apksigner.txt | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          echo "APK_SIGNER_SHA256=$APK_CERT"
          test "$APK_CERT" = "$CANONICAL_SIGNER_SHA256"

          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketGallery-OKF-Mobile-Lab-arm64
          path: |
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk
            pilot/flutter_phone_loop/build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish public prerelease asset
        working-directory: pilot/flutter_phone_loop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="okf-mobile-lab-${GITHUB_RUN_NUMBER}"
          APK="build/app/outputs/flutter-apk/PocketGallery-OKF-Mobile-Lab-arm64.apk"
          SHA="$APK.sha256"
          gh release create "$TAG" \
            "$APK#PocketGallery-OKF-Mobile-Lab-arm64.apk" \
            "$SHA#PocketGallery-OKF-Mobile-Lab-arm64.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "PocketGallery OKF Mobile Lab #${GITHUB_RUN_NUMBER}" \
            --notes "Signed arm64 prerelease. A-F local-model OKF knowledge-layer experiment. Commit ${GITHUB_SHA}." \
            --prerelease
